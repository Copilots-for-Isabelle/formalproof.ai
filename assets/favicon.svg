  <circle cx="16" cy="2.4" r="2" fill="#901A1E"/>
  <rect x="2.4" y="6" width="27.2" height="22" rx="5.2" fill="#7C838D"/>
  <rect x="5.6" y="9.2" width="20.8" height="15.6" rx="3.4"
        fill="#EEF1F5" stroke="#2C2F35" stroke-width="1"/>
  <circle cx="11.6" cy="15.2" r="2.5" fill="#2C2F35"/>
  <circle cx="20.4" cy="15.2" r="2.5" fill="#2C2F35"/>
  <!-- a smile, not a straight line: the robot on the page grins once it is connected -->
